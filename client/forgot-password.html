<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password | EDULEARN</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="page-shell">
      <div class="auth-card">
        <div class="brand-panel">
          <div class="brand-badge">EDULEARN</div>
          <h1>Reset your password.</h1>
          <p>
            Enter your account email and create a new password to continue learning with EDULEARN.
          </p>

          <ul class="feature-list">
            <li>Secure password update</li>
            <li>Quick access recovery</li>
            <li>Simple account recovery</li>
          </ul>
        </div>

        <div class="form-panel">
          <div class="form-header">
            <p class="eyebrow">Reset Password</p>
            <h2>Choose a new password</h2>
          </div>

          <form id="forgotPasswordForm" novalidate>
            <div class="input-group">
              <label for="resetEmail">Email</label>
              <input id="resetEmail" name="resetEmail" type="email" placeholder="Enter your email" />
              <small class="error-message" data-error-for="resetEmail"></small>
            </div>

            <div class="input-group">
              <label for="newPassword">New Password</label>
              <div class="password-wrapper">
                <input id="newPassword" name="newPassword" type="password" placeholder="Enter a new password" />
                <button type="button" class="password-toggle" data-target="newPassword" aria-label="Show password">
                  Show
                </button>
              </div>
              <small class="error-message" data-error-for="newPassword"></small>
            </div>

            <div class="input-group">
              <label for="confirmNewPassword">Confirm New Password</label>
              <div class="password-wrapper">
                <input
                  id="confirmNewPassword"
                  name="confirmNewPassword"
                  type="password"
                  placeholder="Confirm your new password"
                />
                <button type="button" class="password-toggle" data-target="confirmNewPassword" aria-label="Show password">
                  Show
                </button>
              </div>
              <small class="error-message" data-error-for="confirmNewPassword"></small>
            </div>

            <button type="submit" class="signup-button">Reset Password</button>
          </form>

          <div id="formMessage" class="form-message" aria-live="polite"></div>

          <p class="login-link">
            Remember your password?
            <a href="login.html">Back to Login</a>
          </p>
        </div>
      </div>
    </div>

    <script src="js/forgot-password.js"></script>
  </body>
</html>
